name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android project root and ensure Gradle & Kotlin files
        run: |
          rm -f $'\u200bsettings.gradle.kts' $'\u200bREADME.md'
          if [ -f "app/build.gradle.kts" ]; then
            PROJ_DIR="."
          else
            FOUND_APP_GRADLE=$(find . -maxdepth 3 -path "*/app/build.gradle.kts" | head -n 1)
            if [ -z "$FOUND_APP_GRADLE" ]; then
              echo "ERROR: Could not find app/build.gradle.kts in repository"
              ls -la
              exit 1
            fi
            PROJ_DIR=$(dirname "$(dirname "$FOUND_APP_GRADLE")")
          fi
          echo "Using project directory: $PROJ_DIR"
          echo "PROJ_DIR=$PROJ_DIR" >> "$GITHUB_ENV"

          cat << 'EOF' > "$PROJ_DIR/settings.gradle.kts"
          pluginManagement {
              repositories {
                  maven { url = uri("https://dl.google.com/dl/android/maven2/") }
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
              resolutionStrategy {
                  eachPlugin {
                      if (requested.id.namespace == "com.android" || requested.id.id.startsWith("com.android.")) {
                          useModule("com.android.tools.build:gradle:${requested.version}")
                      }
                  }
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  maven { url = uri("https://dl.google.com/dl/android/maven2/") }
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "IaBrowser"
          include(":app")
          EOF

          cat << 'EOF' > "$PROJ_DIR/gradle.properties"
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          TARGET_BROWSER_DIR="$PROJ_DIR/app/src/main/java/com/aegis/browser/browser"
          mkdir -p "$TARGET_BROWSER_DIR"
          find "$PROJ_DIR" -name "UrlValidator.kt" ! -path "$TARGET_BROWSER_DIR/UrlValidator.kt" -delete

          cat << 'EOF' > "$TARGET_BROWSER_DIR/UrlValidator.kt"
          package com.aegis.browser.browser

          import java.net.URI
          import java.net.URLEncoder

          object UrlValidator {

              private val ALLOWED_SCHEMES = setOf("https", "http", "about")
              private val DANGEROUS_SCHEMES = setOf(
                  "javascript", "data", "vbscript", "file", "content", "intent", "blob"
              )

              sealed class ValidationResult {
                  data class Allowed(val normalizedUrl: String) : ValidationResult()
                  data class Blocked(val reason: String) : ValidationResult()
              }

              fun normalizeUserInput(
                  raw: String,
                  searchEngineTemplate: String = "https://duckduckgo.com/?q=%s"
              ): String {
                  val trimmed = raw.trim()
                  if (trimmed.isEmpty() || trimmed == "about:blank") return "about:blank"

                  val lower = trimmed.lowercase()
                  for (scheme in DANGEROUS_SCHEMES) {
                      if (lower.startsWith("$scheme:")) {
                          return "about:blank"
                      }
                  }

                  if (lower.startsWith("https://") || lower.startsWith("http://")) {
                      return trimmed
                  }

                  val looksLikeDomain = !trimmed.contains(" ") &&
                      trimmed.contains(".") &&
                      !trimmed.startsWith(".") &&
                      !trimmed.endsWith(".")

                  return if (looksLikeDomain) {
                      "https://$trimmed"
                  } else {
                      val encoded = URLEncoder.encode(trimmed, "UTF-8")
                      searchEngineTemplate.replace("%s", encoded)
                  }
              }

              fun validateNavigationUrl(url: String): ValidationResult {
                  val trimmed = url.trim()
                  if (trimmed == "about:blank") return ValidationResult.Allowed(trimmed)

                  return try {
                      val uri = URI(trimmed)
                      val scheme = uri.scheme?.lowercase()
                          ?: return ValidationResult.Blocked("Missing URL scheme")

                      if (scheme in DANGEROUS_SCHEMES || scheme !in ALLOWED_SCHEMES) {
                          return ValidationResult.Blocked("Blocked unsafe scheme: $scheme")
                      }

                      if ((scheme == "http" || scheme == "https") && uri.host.isNullOrBlank()) {
                          return ValidationResult.Blocked("Malformed host")
                      }

                      ValidationResult.Allowed(trimmed)
                  } catch (_: Exception) {
                      ValidationResult.Blocked("Invalid URI syntax")
                  }
              }

              fun extractHost(url: String): String {
                  return try {
                      URI(url).host?.lowercase()?.removePrefix("www.") ?: ""
                  } catch (_: Exception) {
                      ""
                  }
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Configure Maven Central mirror
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat << 'EOF' > "$HOME/.gradle/init.d/mirror.gradle"
          gradle.beforeSettings { settings ->
              settings.pluginManagement.repositories.all { repo ->
                  if (repo instanceof MavenArtifactRepository && repo.url.toString().contains("repo.maven.apache.org")) {
                      repo.url = uri("https://maven-central.storage-download.googleapis.com/maven2/")
                  }
              }
              settings.dependencyResolutionManagement.repositories.all { repo ->
                  if (repo instanceof MavenArtifactRepository && repo.url.toString().contains("repo.maven.apache.org")) {
                      repo.url = uri("https://maven-central.storage-download.googleapis.com/maven2/")
                  }
              }
          }
          gradle.allprojects { project ->
              project.buildscript.repositories.all { repo ->
                  if (repo instanceof MavenArtifactRepository && repo.url.toString().contains("repo.maven.apache.org")) {
                      repo.url = uri("https://maven-central.storage-download.googleapis.com/maven2/")
                  }
              }
              project.repositories.all { repo ->
                  if (repo instanceof MavenArtifactRepository && repo.url.toString().contains("repo.maven.apache.org")) {
                      repo.url = uri("https://maven-central.storage-download.googleapis.com/maven2/")
                  }
              }
          }
          EOF

      - name: Run unit tests (Blocker & E2EE Crypto)
        working-directory: ${{ env.PROJ_DIR }}
        run: |
          for attempt in 1 2 3; do
            if gradle :app:testDebugUnitTest --no-daemon --stacktrace; then
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Assemble Debug & Release APKs
        working-directory: ${{ env.PROJ_DIR }}
        run: |
          for attempt in 1 2 3; do
            if gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace; then
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Collect single APK files
        run: |
          mkdir -p apk-dist
          DEBUG_APK=$(find "${{ env.PROJ_DIR }}/app/build/outputs/apk/debug" -name "*.apk" | head -n 1)
          RELEASE_APK=$(find "${{ env.PROJ_DIR }}/app/build/outputs/apk/release" -name "*.apk" | head -n 1)
          cp "$DEBUG_APK" "apk-dist/Aegis-debug.apk"
          cp "$RELEASE_APK" "apk-dist/Aegis-release.apk"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Aegis-debug
          path: apk-dist/Aegis-debug.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Aegis-release
          path: apk-dist/Aegis-release.apk
          if-no-files-found: error
