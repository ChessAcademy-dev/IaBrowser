# searxng/settings.yml (Schlankes Setup ohne Ads/Telemetry, JSON & HTML aktiviert)
use_default_settings: true

server:
  secret_key: "CHANGE_THIS_TO_A_RANDOM_64_CHAR_HEX_STRING"
  limiter: true
  image_proxy: true

ui:
  static_use_hash: true
  default_theme: simple
  query_in_title: false
  infinite_scroll: false

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

engines:
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: mojee
    disabled: false
  - name: github
    disabled: false
  - name: stackoverflow
    disabled: false
